<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRIKI Arcade</title><meta name="theme-color" content="#101713"><meta name="app-version" content="1.0.0">
<link rel="stylesheet" href="style.css"></head><body class="welcome">
<h1>TRIKI <span>ARCADE</span></h1>
<section id="welcome" aria-labelledby="welcome-title">
<h2 id="welcome-title">Połącz Triki, aby rozpocząć</h2>
<p>Włącz urządzenie i połącz je z aplikacją.</p>
<button id="welcome-connect">Wyszukaj Triki</button>
<span class="pill" id="welcome-status" aria-live="polite">Niepołączone</span>
</section>
<div class="bar"><button id="bc">Połącz z Triki</button><button class="g" id="bu">↻ Sprawdź aktualizacje</button><span class="pill" id="st">niepołączone</span><button class="g" id="bm" hidden>Menu</button></div>
<div id="upmsg" aria-live="polite"></div>
<div id="dl"></div>
<div id="menu"></div>
<section id="game-options" hidden>
<h2 id="game-options-title"></h2>
<div class="mode-options"><button id="solo-mode">Solo · 1 Triki</button><button class="g" id="hotseat-mode">Hot seat · 2 graczy</button><button class="g" id="duo-mode" hidden>2 Triki · Cymbergaj</button></div>
<button class="g" id="options-back">Wróć do menu</button>
</section>
<h2 id="game-title" hidden></h2>
<canvas id="cv" width="360" height="480"></canvas>
<div id="over-actions" class="over-actions" hidden><button id="retry">Jeszcze raz</button><button class="g" id="leave">Menu</button></div>
<div id="hint"></div>
<details><summary>Ustawienia i diagnostyka</summary>
<label>Czułość kręcenia <input type="range" id="s1" min="1" max="10" value="5"></label>
<label>Czułość pochylenia <input type="range" id="s2" min="1" max="10" value="5"></label>
<label>Czułość stuknięcia <input type="range" id="s3" min="1" max="10" value="5"></label>
<label>Odwróć kierunek kręcenia <input type="checkbox" id="inv"></label>
<button class="g" id="rs">Zeruj rekordy</button>
<pre id="lg"></pre><div id="dbg">Bez Triki możesz grać z klawiatury: ←/→ kręcenie, ↑/↓ pochylenie, spacja stuknięcie, F odwrócenie, Esc menu.</div>
</details>
<script src="app.js"></script></body></html>
